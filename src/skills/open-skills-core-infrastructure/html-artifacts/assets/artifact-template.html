<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Artifact title</title>
  <style>
    :root {
      --font-sans: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --font-mono: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      --canvas: #f7f3e8;
      --surface: #fffdf8;
      --surface-strong: #ffffff;
      --ink: #15243a;
      --muted: #647185;
      --blue: #153d6f;
      --blue-soft: #dce8f5;
      --gold: #c7922f;
      --gold-soft: #f4e4b9;
      --border: #ccd6e2;
      --success: #28795a;
      --warning: #9a641c;
      --danger: #a33b3b;
      --space-1: .25rem;
      --space-2: .5rem;
      --space-3: .75rem;
      --space-4: 1rem;
      --space-5: 1.5rem;
      --space-6: 2rem;
      --space-7: 3rem;
      --space-8: 4.5rem;
      --radius-sm: .5rem;
      --radius-md: .9rem;
      --radius-lg: 1.4rem;
      --shadow: 0 14px 40px rgba(21, 61, 111, .09);
      --content: 72rem;
    }
    * { box-sizing: border-box; }
    html { color-scheme: light; scroll-behavior: smooth; }
    body { margin: 0; background: var(--canvas); color: var(--ink); font-family: var(--font-sans); line-height: 1.6; }
    a { color: var(--blue); }
    :focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
    .shell { width: min(calc(100% - 2rem), var(--content)); margin-inline: auto; padding-block: var(--space-7); }
    .eyebrow { color: var(--gold); font-size: .78rem; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
    h1, h2, h3 { color: var(--blue); line-height: 1.15; text-wrap: balance; }
    h1 { max-width: 18ch; margin: var(--space-2) 0 var(--space-4); font-size: clamp(2.35rem, 6vw, 5.5rem); letter-spacing: -.045em; }
    h2 { margin-top: 0; font-size: clamp(1.45rem, 3vw, 2.2rem); }
    .lede { max-width: 68ch; color: var(--muted); font-size: clamp(1.05rem, 2vw, 1.3rem); }
    .panel { margin-top: var(--space-6); padding: clamp(1.25rem, 4vw, 2.25rem); background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--shadow); }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 15rem), 1fr)); gap: var(--space-4); }
    .card { padding: var(--space-5); background: var(--surface-strong); border: 1px solid var(--border); border-radius: var(--radius-md); }
    .metric { color: var(--blue); font-size: clamp(2rem, 5vw, 3.4rem); font-weight: 800; line-height: 1; }
    .tag { display: inline-flex; padding: .28rem .65rem; background: var(--gold-soft); color: #69450d; border-radius: 999px; font-size: .78rem; font-weight: 750; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: .85rem 1rem; border-bottom: 1px solid var(--border); text-align: left; vertical-align: top; }
    th { color: var(--blue); background: var(--blue-soft); }
    .timeline { display: grid; gap: var(--space-4); border-left: 3px solid var(--gold); padding-left: var(--space-5); }
    .timeline article { position: relative; }
    .timeline article::before { content: ""; position: absolute; left: calc(-1.5rem - 7px); top: .45rem; width: 11px; height: 11px; background: var(--gold); border: 3px solid var(--canvas); border-radius: 50%; }
    .diagram { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: var(--space-3); }
    .node { min-width: 10rem; padding: var(--space-4); background: var(--blue-soft); border: 1px solid var(--blue); border-radius: var(--radius-md); text-align: center; }
    .arrow { color: var(--gold); font-size: 1.5rem; font-weight: 900; }
    footer { margin-top: var(--space-7); color: var(--muted); font-size: .88rem; }
    @media (max-width: 40rem) { .shell { padding-block: var(--space-6); } .arrow { transform: rotate(90deg); } }
    @media print { body { background: white; } .shell { width: 100%; padding: 0; } .panel { box-shadow: none; break-inside: avoid; } }
    @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div class="eyebrow">Artifact label</div>
      <h1>Clear, specific artifact title</h1>
      <p class="lede">State the purpose, scope, and most useful takeaway in one compact introduction.</p>
    </header>

    <!-- Choose and adapt only the patterns the content needs. -->
    <section class="panel" aria-labelledby="summary-title">
      <h2 id="summary-title">Summary</h2>
      <div class="grid">
        <article class="card"><span class="tag">Finding</span><h3>Key point</h3><p>Explain the evidence and implication.</p></article>
        <article class="card"><div class="metric">01</div><p>Use metrics only when they help interpretation.</p></article>
      </div>
    </section>

    <footer>Self-contained HTML artifact · Works offline</footer>
  </main>
  <script>
    "use strict";
    // Add progressive enhancement only when it materially improves comprehension.
  </script>
</body>
</html>
